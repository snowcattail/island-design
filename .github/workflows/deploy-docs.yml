name: Deploy demo to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: read

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - uses: actions/configure-pages@v5
              id: pages
            - run: npm ci
            - run: npm run check:types --workspace=@island-design/demo
            - run: npm run build --workspace=@island-design/demo -- --base="${PAGES_BASE_PATH}/"
              env:
                  PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
            - uses: actions/upload-pages-artifact@v4
              with:
                  path: apps/demo/demo-dist

    deploy:
        if: github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/deploy-pages@v4
              id: deployment
